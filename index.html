<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arch Linux Security Tracker</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --sev-crit: #f85149;
    --sev-high: #ff7b72;
    --sev-med:  #d29922;
    --sev-low:  #8b949e;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #0969da;
    }
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --panel: #f6f8fa;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #656d76;
    --accent: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px 48px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
  }
  header { max-width: 1100px; margin: 0 auto; padding: 24px 0 12px; }
  main   { max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .subtitle { color: var(--muted); margin: 0 0 16px; }
  .meta { display: flex; flex-wrap: wrap; gap: 16px; color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .meta strong { color: var(--text); font-weight: 600; }
  .notice {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 10px 14px;
    border-radius: 4px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input[type="search"], select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font: inherit;
  }
  input[type="search"] { flex: 1; min-width: 200px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; }
  thead th {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
    background: var(--panel);
  }
  thead th:hover { color: var(--text); }
  tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: color-mix(in srgb, var(--panel), var(--text) 4%); }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }
  .cve-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .cve {
    font-family: var(--mono);
    font-size: 11.5px;
    background: color-mix(in srgb, var(--panel), var(--text) 8%);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 3px;
    text-decoration: none;
    color: var(--text);
  }
  .cve:hover { border-color: var(--accent); color: var(--accent); }
  .badge-repo {
    display: inline-block;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    color: var(--accent);
    font-family: var(--mono);
  }
  .count-badge {
    display: inline-block;
    min-width: 22px;
    text-align: center;
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    background: var(--sev-med);
    color: #000;
  }
  .count-badge.c3 { background: var(--sev-high); color: #fff; }
  .count-badge.c5 { background: var(--sev-crit); color: #fff; }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }
  a { color: var(--accent); }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); }
  .cve.unfixed { border-style: dashed; color: var(--muted); }
  .cve.uncertain { border-style: dotted; }
  .cve.uncertain::after { content: "?"; color: var(--muted); margin-left: 2px; }
  .subpkgs { color: var(--muted); font-size: 11.5px; }
  label.toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .table-wrap { overflow-x: auto; }
  .cve-line { display: flex; gap: 4px; align-items: center; flex-wrap: nowrap; white-space: nowrap; }
  .more {
    font: inherit; font-size: 11.5px; cursor: pointer; padding: 1px 7px; border-radius: 3px;
    border: 1px solid var(--border); background: transparent; color: var(--accent);
  }
  .more:hover { border-color: var(--accent); }
  .pkg a.name { color: var(--text); text-decoration: none; font-weight: 600; }
  .pkg a.name:hover { color: var(--accent); text-decoration: underline; }
  .links { font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .cve, thead th, td.nowrap { white-space: nowrap; }
  .links a { color: var(--muted); }
  .links a:hover { color: var(--accent); }
  .when { white-space: nowrap; font-size: 12px; }
  .when small { display: block; color: var(--muted); }
  tr.detail > td { background: var(--bg); padding: 0 10px 12px; }
  .detail table { border: none; background: transparent; margin-top: 4px; }
  .detail td, .detail th { padding: 5px 8px; font-size: 12.5px; border-bottom: 1px solid var(--border); }
  .detail th { position: static; text-transform: none; letter-spacing: 0; cursor: default; }
  .detail .summary { color: var(--muted); max-width: 520px; }
  .detail .refs a { margin-right: 8px; white-space: nowrap; }
  .tag { font-size: 10.5px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--border); color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Arch Linux Security Tracker</h1>
  <p class="subtitle">Upstream CVEs affecting packages in the official Arch repos (core / extra / multilib).</p>
  <div class="meta" id="meta">
    <span>loading…</span>
  </div>
  <div class="notice" id="notice"></div>
</header>
<main>
  <div class="controls">
    <input type="search" id="q" placeholder="Filter packages or CVE IDs…" autocomplete="off">
    <select id="repoFilter" aria-label="Repository">
      <option value="">all repos</option>
      <option value="core">core</option>
      <option value="extra">extra</option>
      <option value="multilib">multilib</option>
    </select>
    <select id="since" aria-label="Latest CVE published within">
      <option value="0">any time</option>
      <option value="1">last 24 hours</option>
      <option value="7">last 7 days</option>
      <option value="30">last 30 days</option>
      <option value="90">last 90 days</option>
      <option value="365">last year</option>
    </select>
    <label class="toggle"><input type="checkbox" id="showUncertain"> include uncertain</label>
    <label class="toggle"><input type="checkbox" id="showUnfixed"> include unfixed upstream</label>
  </div>
  <div class="table-wrap">
  <table id="tbl">
    <thead>
      <tr>
        <th data-sort="latest">Latest CVE ▾</th>
        <th data-sort="name">Package (base)</th>
        <th data-sort="version">Installed</th>
        <th>Fixed in</th>
        <th data-sort="count">CVEs</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="5" class="empty">loading data…</td></tr>
    </tbody>
  </table>
  </div>
</main>
<footer>
  Data: <a href="https://osv.dev">OSV.dev</a> (Debian / Alpine security trackers) · Packages: official Arch repo DBs ·
  <a id="repoLink" href="#">source</a>
</footer>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const rows = $("rows"), meta = $("meta"), notice = $("notice"), q = $("q");
  const repoFilter = $("repoFilter"), since = $("since");
  const showUnfixed = $("showUnfixed"), showUncertain = $("showUncertain");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const enc = encodeURIComponent;
  const CHIPS = 2;  // CVE chips shown on the collapsed line

  let data;
  try {
    const resp = await fetch("data/vulns.json", { cache: "no-cache" });
    data = await resp.json();
  } catch (e) {
    rows.innerHTML = `<tr><td colspan="5" class="empty">Failed to load data/vulns.json: ${esc(e)}</td></tr>`;
    return;
  }

  // Dates in the viewer's own time zone.
  const dateFmt = new Intl.DateTimeFormat(undefined, { year: "numeric", month: "short", day: "numeric" });
  const dateTimeFmt = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" });
  const relFmt = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
  const ts = iso => { const t = Date.parse(iso || ""); return Number.isNaN(t) ? 0 : t; };
  const relative = t => {
    const days = Math.round((t - Date.now()) / 86400000);
    if (Math.abs(days) < 1) return relFmt.format(Math.round((t - Date.now()) / 3600000), "hour");
    if (Math.abs(days) < 60) return relFmt.format(days, "day");
    if (Math.abs(days) < 730) return relFmt.format(Math.round(days / 30), "month");
    return relFmt.format(Math.round(days / 365), "year");
  };

  meta.innerHTML =
    `<span><strong>${data.affected_count}</strong> affected packages</span>` +
    `<span><strong>${data.total_vulns}</strong> unique CVEs with a fix</span>` +
    `<span><strong>${data.total_uncertain ?? 0}</strong> uncertain</span>` +
    `<span><strong>${data.total_unfixed ?? 0}</strong> unfixed upstream</span>` +
    `<span>data refreshed <strong>${esc(dateTimeFmt.format(new Date(data.generated_at * 1000)))}</strong></span>`;
  notice.textContent = data.limitations || "";

  // Same mapping Arch's devtools use for packaging repo paths on GitLab.
  const gitlabPath = n => n
    .replace(/([a-zA-Z0-9]+)\+([a-zA-Z]+)/g, "$1-$2").replace(/\+/g, "plus")
    .replace(/[^a-zA-Z0-9_\-.]/g, "-").replace(/[_\-]{2,}/g, "-").replace(/^tree$/, "unix-tree");
  const gitlab = p => `https://gitlab.archlinux.org/archlinux/packaging/packages/${gitlabPath(p.name)}`;
  const pkgPage = p => {
    const name = (p.packages || []).includes(p.name) ? p.name : (p.packages || [p.name])[0];
    return `https://archlinux.org/packages/${enc(p.repo)}/${enc(p.arch || "x86_64")}/${enc(name)}/`;
  };
  const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
  const cveLinks = v => {
    const links = [];
    if (v.cve) {
      links.push(["CVE.org", `https://www.cve.org/CVERecord?id=${enc(v.cve)}`]);
      links.push(["NVD", `https://nvd.nist.gov/vuln/detail/${enc(v.cve)}`]);
      links.push(["Debian", `https://security-tracker.debian.org/tracker/${enc(v.cve)}`]);
    }
    for (const id of v.sources || [v.id]) links.push([id.startsWith("ALPINE") ? "OSV (Alpine)" : "OSV", `https://osv.dev/vulnerability/${enc(id)}`]);
    return links;
  };

  let sortKey = "latest", sortDir = -1;
  const expanded = new Set();

  function render() {
    const term = q.value.trim().toLowerCase();
    const repo = repoFilter.value;
    const windowMs = Number(since.value) * 86400000;
    const kindOf = p => {
      const m = new Map();
      (p.unfixed || []).forEach(v => m.set(v.id, "unfixed"));
      (p.uncertain || []).forEach(v => m.set(v.id, "uncertain"));
      return m;
    };
    const vulnsOf = p => p.vulns
      .concat(showUncertain.checked ? (p.uncertain || []) : [])
      .concat(showUnfixed.checked ? (p.unfixed || []) : [])
      .slice().sort((a, b) => ts(b.published) - ts(a.published));
    const latestOf = p => Math.max(0, ...vulnsOf(p).map(v => ts(v.published)));

    let items = data.affected.filter(p => {
      if (repo && p.repo !== repo) return false;
      const list = vulnsOf(p);
      if (!list.length) return false;
      if (windowMs && latestOf(p) < Date.now() - windowMs) return false;
      if (!term) return true;
      if (p.name.toLowerCase().includes(term)) return true;
      if ((p.packages || []).some(n => n.toLowerCase().includes(term))) return true;
      return list.some(v => (v.id || "").toLowerCase().includes(term) || (v.cve || "").toLowerCase().includes(term));
    });

    const keyOf = {
      count: p => vulnsOf(p).length, name: p => p.name,
      version: p => p.version, latest: latestOf,
    }[sortKey];
    items.sort((a, b) => {
      const va = keyOf(a), vb = keyOf(b);
      return va < vb ? -sortDir : va > vb ? sortDir : 0;
    });
    document.querySelectorAll("th[data-sort]").forEach(th => {
      th.textContent = th.textContent.replace(/ [▴▾]$/, "") + (th.dataset.sort === sortKey ? (sortDir < 0 ? " ▾" : " ▴") : "");
    });

    if (!items.length) {
      rows.innerHTML = `<tr><td colspan="5" class="empty">no matches</td></tr>`;
      return;
    }

    rows.innerHTML = items.map(p => {
      const list = vulnsOf(p), kinds = kindOf(p), key = `${p.repo}/${p.name}`;
      const n = list.length, open = expanded.has(key);
      const badge = n >= 5 ? "c5" : n >= 3 ? "c3" : "";
      const chip = v => {
        const kind = kinds.get(v.id) || "";
        const note = kind === "unfixed" ? "no fix upstream yet"
          : kind === "uncertain" ? `uncertain: Arch's version can't be reliably compared with fix ${(v.fixed_versions || []).join(", ")}` : "";
        const title = [note, v.severity, v.summary].filter(Boolean).join(" — ");
        const href = v.cve ? `https://www.cve.org/CVERecord?id=${enc(v.cve)}` : `https://osv.dev/vulnerability/${enc(v.id)}`;
        return `<a class="cve ${kind}" href="${href}" target="_blank" rel="noopener" title="${esc(title)}">${esc(v.cve || v.id)}</a>`;
      };
      const shown = list.slice(0, CHIPS).map(chip).join("");
      const toggle = `<button class="more" data-key="${esc(key)}" aria-expanded="${open}">${
        open ? "hide" : n > CHIPS ? `+${n - CHIPS} · details` : "details"}</button>`;

      const subs = (p.packages || []).filter(x => x !== p.name);
      const upstream = safeUrl(p.url);
      const links = [
        `<a href="${gitlab(p)}" target="_blank" rel="noopener">PKGBUILD</a>`,
        `<a href="${gitlab(p)}/-/issues" target="_blank" rel="noopener">issues</a>`,
        upstream ? `<a href="${esc(upstream)}" target="_blank" rel="noopener">upstream</a>` : "",
      ].filter(Boolean).join(" · ");
      const subHtml = subs.length
        ? `<div class="subpkgs">${esc(subs.slice(0, 4).join(", "))}${subs.length > 4 ? ` +${subs.length - 4}` : ""}</div>` : "";

      const allFixes = new Set();
      list.forEach(v => (v.fixed_versions || []).forEach(f => allFixes.add(f)));
      const fixed = [...allFixes].slice(0, 3).join(", ") + (allFixes.size > 3 ? " …" : "");
      const latest = latestOf(p);
      const built = p.builddate ? `Arch build: ${dateTimeFmt.format(new Date(p.builddate * 1000))}` : "";

      let html = `<tr>
        <td class="when">${latest ? `${esc(dateFmt.format(new Date(latest)))}<small>${esc(relative(latest))}</small>` : "—"}</td>
        <td class="pkg mono"><a class="name" href="${pkgPage(p)}" target="_blank" rel="noopener">${esc(p.name)}</a> <span class="badge-repo">${esc(p.repo)}</span>${subHtml}<div class="links">${links}</div></td>
        <td class="mono nowrap" title="${esc(built)}">${esc(p.version)}</td>
        <td class="mono" style="color:var(--muted);font-size:12px">${esc(fixed) || "—"}</td>
        <td><div class="cve-line"><span class="count-badge ${badge}">${n}</span>${shown}${toggle}</div></td>
      </tr>`;
      if (open) {
        html += `<tr class="detail"><td colspan="5"><table>
          <thead><tr><th>CVE</th><th>Published</th><th>Status</th><th>Fixed in</th><th>Summary</th><th>Links</th></tr></thead>
          <tbody>${list.map(v => {
            const t = ts(v.published);
            const kind = kinds.get(v.id) || "fixable";
            const own = cveLinks(v);
            const known = new Set(own.map(([, u]) => u.replace(/\/$/, "")));
            const refs = own.map(([label, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(label)}</a>`)
              .concat((v.references || []).map(safeUrl).filter(u => u && !known.has(u.replace(/\/$/, ""))).slice(0, 3)
                .map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener" title="${esc(u)}">ref ${i + 1}</a>`));
            return `<tr>
              <td class="mono">${chip(v)}</td>
              <td class="when">${t ? esc(dateFmt.format(new Date(t))) : "—"}</td>
              <td><span class="tag">${esc(kind)}</span></td>
              <td class="mono">${esc((v.fixed_versions || []).join(", ")) || "—"}</td>
              <td class="summary">${esc(v.summary) || "—"}</td>
              <td class="refs">${refs.join("")}</td>
            </tr>`;
          }).join("")}</tbody></table></td></tr>`;
      }
      return html;
    }).join("");
  }

  rows.addEventListener("click", e => {
    const btn = e.target.closest("button.more");
    if (!btn) return;
    const key = btn.dataset.key;
    expanded.has(key) ? expanded.delete(key) : expanded.add(key);
    render();
  });
  document.querySelectorAll("th[data-sort]").forEach(th => {
    th.addEventListener("click", () => {
      const k = th.dataset.sort;
      if (sortKey === k) sortDir = -sortDir;
      else { sortKey = k; sortDir = (k === "count" || k === "latest") ? -1 : 1; }
      render();
    });
  });
  q.addEventListener("input", render);
  [repoFilter, since, showUnfixed, showUncertain].forEach(el => el.addEventListener("change", render));
  render();

  const repoLink = $("repoLink");
  const loc = window.location.hostname;
  if (loc.endsWith("github.io")) {
    const [user] = loc.split(".");
    const path = window.location.pathname.split("/").filter(Boolean)[0] || "";
    repoLink.href = `https://github.com/${user}/${path}`;
  } else {
    repoLink.textContent = "";
  }
})();
</script>
</body>
</html>
