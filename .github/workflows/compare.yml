name: Compare against NVD / MITRE / Repology

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare sources
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python tools/compare_sources.py
          cat reports/compare.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/compare.md reports/compare.json
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "reports: source comparison $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
