name: Update tracker

on:
  schedule:
    # Every 6 hours: OSV's exports and the Arch repos both move several times a day.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - archsec/**
      - site/**
      - update.py
      - aliases.json
      - .github/workflows/update.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -t .

      # Writes _site/data/advisories.json and _site/all.json. Generated data is
      # published, not committed: the feed is rebuilt from its sources each run.
      - name: Build feed
        run: python update.py --out _site

      - name: Stage site
        run: |
          cp site/* _site/
          cp archsec/check.py _site/arch-cve-check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
