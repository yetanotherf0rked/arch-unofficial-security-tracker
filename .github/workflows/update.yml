name: Update tracker

on:
  schedule:
    - cron: "17 */6 * * *"   # best effort: GitHub may delay scheduled runs
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Arch tools and sync databases (core, extra, multilib)
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed python expac git nodejs
      - uses: actions/checkout@v7
      - name: Test
        run: python -m unittest discover -s tests -t .
      - name: Build feed
        run: python build.py --out _site
      - name: Stage site
        run: |
          cp site/* _site/
          cp arch_cve_check.py _site/arch-cve-check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
