name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is tested by update.yml before every deploy

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed python expac nodejs
      - uses: actions/checkout@v7
      - run: python -m unittest discover -s tests -t . -v
